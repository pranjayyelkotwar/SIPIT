[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sipit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets",
    "numpy",
    "pandas",
    "python-dotenv",
    "sentencepiece",
    "torch>=2.0",
    "tqdm",
    "transformers>=4.40",
    "wcwidth",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sipit = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]